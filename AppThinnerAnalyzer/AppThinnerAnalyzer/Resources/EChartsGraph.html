<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AppThinner Dependency Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #020617;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    #chart {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    var chart = echarts.init(document.getElementById('chart'));

    function formatSize(bytes) {
      if (bytes === null || bytes === undefined || isNaN(bytes)) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
      return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
    }

    function setGraphData(payloadJson) {
      var payload = typeof payloadJson === 'string' ? JSON.parse(payloadJson) : payloadJson;
      var nodes = payload.nodes || [];
      var links = payload.links || [];

      // 兼容 categories（如果上层有传）
      var categories = payload.categories || [];

      // 参考 ECharts graph 示例进行美化：暗色背景、力导布局、邻接高亮
      var option = {
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'item',
          formatter: function (params) {
            var d = params.data || {};
            var name = (d.name || params.name || '').replace(/\n/g, ' ');
            var size = d.size;
            var sizeStr = size != null ? formatSize(size) : 'Unknown size';
            var unused = d.unusedRatio;
            var unusedStr = (typeof unused === 'number')
              ? (unused * 100).toFixed(1) + '%'
              : '—';
            var typeLabel = params.dataType === 'edge' ? 'Dependency' : 'Node';
            return '' +
              '<div style="padding:6px 8px;min-width:160px;">' +
              '<div style="font-weight:600;margin-bottom:4px;">[' + typeLabel + '] ' + name + '</div>' +
              '<div style="color:#9ca3af;font-size:12px;">Size: ' + sizeStr + '</div>' +
              '<div style="color:#f97316;font-size:12px;">Unused: ' + unusedStr + '</div>' +
              '</div>';
          }
        },
        legend: categories.length ? [{
          data: categories.map(function (c) { return c.name; }),
          textStyle: { color: '#e5e7eb' },
          top: 8,
          left: 8
        }] : [],
        series: [{
          type: 'graph',
          layout: 'force',
          data: nodes,
          links: links,
          categories: categories,
          roam: true,
          draggable: true,
          focusNodeAdjacency: true,
          symbolSize: function (value, params) {
            var d = params.data || {};
            var base = 12;
            var sizeBytes = d.size || 0;
            if (!sizeBytes || isNaN(sizeBytes)) return base;
            var kb = sizeBytes / 1024;
            var extra = Math.min(24, Math.log2(kb + 1) * 3);
            return base + extra;
          },
          label: {
            show: true,
            position: 'right',
            formatter: function (params) {
              var name = params.data && params.data.shortName ? params.data.shortName : params.name;
              return name;
            },
            color: '#e5e7eb',
            fontSize: 11
          },
          // 节点颜色：默认蓝色；存在无用占比时按 unusedRatio 从橙到红渐变
          itemStyle: {
            color: function (params) {
              var d = params.data || {};
              var u = typeof d.unusedRatio === 'number' ? Math.max(0, Math.min(1, d.unusedRatio)) : 0;
              if (u <= 0) {
                return '#3b82f6';
              }
              var start = [245, 158, 11]; // #f59e0b
              var end = [239, 68, 68];    // #ef4444
              var r = u;
              var c = [
                Math.round(start[0] + (end[0] - start[0]) * r),
                Math.round(start[1] + (end[1] - start[1]) * r),
                Math.round(start[2] + (end[2] - start[2]) * r)
              ];
              return 'rgb(' + c.join(',') + ')';
            },
            borderColor: '#020617',
            borderWidth: 1
          },
          lineStyle: {
            color: 'rgba(148, 163, 184, 0.9)',
            width: 1.2,
            curveness: 0.15,
            opacity: 0.8
          },
          edgeSymbol: ['none', 'arrow'],
          edgeSymbolSize: 7,
          emphasis: {
            scale: true,
            itemStyle: {
              shadowBlur: 20,
              shadowColor: 'rgba(59,130,246,0.7)'
            },
            lineStyle: {
              width: 2,
              color: '#f97316'
            }
          },
          force: {
            repulsion: 220,
            edgeLength: [80, 220],
            gravity: 0.08,
            friction: 0.2,
            layoutAnimation: true
          }
        }]
      };

      chart.setOption(option, true);
    }
    window.setGraphData = setGraphData;
    window.onresize = function() { chart.resize(); };
  </script>
</body>
</html>
